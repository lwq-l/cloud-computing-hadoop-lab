name: Validate Hadoop lab image

on:
  push:
    branches: [ main ]
    paths:
      - '.devcontainer/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build teaching image
        run: docker build -f .devcontainer/Dockerfile -t hadoop-lab:test .

      - name: Verify Java and Hadoop
        run: |
          docker run --rm --entrypoint bash hadoop-lab:test -lc 'java -version && hadoop version'

      - name: Verify lab setup and single-node HDFS
        run: |
          docker run --rm             --entrypoint bash             -v "$PWD:/workspace"             -w /workspace             hadoop-lab:test -lc '
              bash scripts/setup-hadoop.sh &&
              bash scripts/start-hdfs.sh &&
              jps &&
              hdfs dfsadmin -report &&
              curl -fsSI http://127.0.0.1:9870/ | head -n 1 &&
              hdfs dfs -mkdir -p /cloudlab/test &&
              echo "CI Hadoop test" > /tmp/ci.txt &&
              hdfs dfs -put -f /tmp/ci.txt /cloudlab/test/ &&
              hdfs dfs -cat /cloudlab/test/ci.txt &&
              bash scripts/stop-hdfs.sh
            '


      - name: Verify multi-node HDFS
        run: |
          docker run --rm             --entrypoint bash             -v "$PWD:/workspace"             -w /workspace             hadoop-lab:test -lc '
              bash scripts/setup-hadoop.sh &&
              bash scripts/multinode/setup-multinode.sh &&
              bash scripts/multinode/start-multinode.sh &&
              bash scripts/multinode/status-multinode.sh | tee /tmp/status3.txt &&
              grep -q "Live datanodes (3)" /tmp/status3.txt &&
              source scripts/multinode/activate.sh &&
              hdfs dfs -mkdir -p /multilab/input &&
              hdfs dfs -put -f data/hello.txt /multilab/input/ &&
              hdfs fsck /multilab/input/hello.txt -files -blocks -locations | tee /tmp/fsck.txt &&
              grep -q "Average block replication: 3.0" /tmp/fsck.txt &&
              bash scripts/multinode/stop-one-datanode.sh 2 &&
              bash scripts/multinode/status-multinode.sh | tee /tmp/status2.txt &&
              grep -q "Live datanodes (2)" /tmp/status2.txt &&
              hdfs dfs -cat /multilab/input/hello.txt &&
              bash scripts/multinode/start-one-datanode.sh 2 &&
              bash scripts/multinode/stop-multinode.sh
            '
